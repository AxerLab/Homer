services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aislides
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  tex-service:
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    restart: unless-stopped

  pptx-service:
    build:
      context: ./pptx_service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    restart: unless-stopped

volumes:
  postgres_data:
