name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]  # Deploy on every push to main

env:
  RESOURCE_GROUP: pptai-rg  # Change to your resource group name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker images
      run: |
        # Build services individually (avoids dependency resolution issues)
        docker compose build backend
        docker compose build frontend
        docker compose build tex-service
        docker compose build pptx-service

        # Tag and push backend
        docker tag pptai-backend:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest

        # Tag and push frontend
        docker tag pptai-frontend:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest

        # Tag and push tex-service
        docker tag pptai-tex-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest

        # Tag and push pptx-service
        docker tag pptai-pptx-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        # Update each container app with the new image
        az containerapp update \
          --name pptai-backend \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest

        az containerapp update \
          --name pptai-frontend \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest

        az containerapp update \
          --name pptai-tex-service \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest

        az containerapp update \
          --name pptai-pptx-service \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest
