[project]
name = "rag-service"
version = "0.1.0"
description = "RAG microservice for document ingestion and retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=22.0,<25.0",
    "azure-identity>=1.19.0",
    "azure-storage-blob>=12.24.0",
    "colorlog>=6.9.0",
    "fastapi>=0.121.2",
    "fastembed>=0.3.0",
    "httpx>=0.28.1",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pydantic>=2.11.7",
    "pymupdf>=1.26.0",
    "pymupdf4llm>=0.0.26",
    "python-dotenv>=1.1.1",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
