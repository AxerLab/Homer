name: Build and Deploy to Azure

on:
  push:
    branches: [ main ]  # Deploy on every push to main

env:
  RESOURCE_GROUP: pptai  # Resource group name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space (aggressive)
      run: |
        # Remove unnecessary tools to free ~50GB
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/Python
        sudo rm -rf /opt/hostedtoolcache/Ruby
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /opt/hostedtoolcache/node
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker system prune -af
        sudo apt-get clean
        df -h
    
    - uses: actions/checkout@v3

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push lightweight services
      run: |
        # Build and push lightweight services first
        docker compose build frontend
        docker tag pptai-frontend:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest
        docker rmi pptai-frontend:latest || true

        docker compose build tex-service
        docker tag pptai-tex-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest
        docker rmi pptai-tex-service:latest || true

        docker compose build pptx-service
        docker tag pptai-pptx-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest
        docker rmi pptai-pptx-service:latest || true

        # Cleanup before heavy builds
        docker system prune -af
        df -h

    - name: Build and push backend
      run: |
        docker compose build backend
        docker tag pptai-backend:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest
        docker rmi pptai-backend:latest || true
        docker system prune -af
        df -h

    - name: Build and push rag-service
      run: |
        docker compose build rag-service
        docker tag pptai-rag-service:latest ${{ secrets.ACR_LOGIN_SERVER }}/pptai-rag-service:latest
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/pptai-rag-service:latest
        docker rmi pptai-rag-service:latest || true

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      run: |
        # Update each container app with the new image
        az containerapp update \
          --name pptai-backend \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-backend:latest

        az containerapp update \
          --name pptai-frontend \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-frontend:latest

        az containerapp update \
          --name pptai-tex-service \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-tex-service:latest

        az containerapp update \
          --name pptai-pptx-service \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-pptx-service:latest

        az containerapp update \
          --name pptai-rag-service \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ secrets.ACR_LOGIN_SERVER }}/pptai-rag-service:latest
