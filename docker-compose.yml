services:
  backend:
    image: pptai-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false  # Optional for CI builds
    environment:
      - RAG_SERVICE_URL=http://rag-service:8002
    depends_on:
      - db
      - tex-service
      - pptx-service
      - rag-service
    restart: unless-stopped

  frontend:
    image: pptai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aislides
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  tex-service:
    image: pptai-tex-service:latest
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    restart: unless-stopped

  pptx-service:
    image: pptai-pptx-service:latest
    build:
      context: ./pptx_service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    restart: unless-stopped

  rag-service:
    image: pptai-rag-service:latest
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    ports:
      - '8002:8002'
    env_file:
      - path: ./rag_service/.env
        required: false
    volumes:
      - rag_storage:/app/rag_storage
      - rag_parsed:/app/rag_parsed
      - rag_uploads:/app/rag_uploads
    restart: unless-stopped

  mcp-server:
    image: pptai-mcp-server:latest
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - '8003:8003'
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  rag_storage:
  rag_parsed:
  rag_uploads:
