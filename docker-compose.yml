services:
  backend:
    image: pptai-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false  # Optional for CI builds
    depends_on:
      - db
      - tex-service
      - pptx-service
    restart: unless-stopped

  frontend:
    image: pptai-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aislides
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  tex-service:
    image: pptai-tex-service:latest
    build:
      context: ./tex_service
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    restart: unless-stopped

  pptx-service:
    image: pptai-pptx-service:latest
    build:
      context: ./pptx_service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    restart: unless-stopped

volumes:
  postgres_data:
